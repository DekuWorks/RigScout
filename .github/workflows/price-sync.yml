name: Scheduled Price Sync

on:
  schedule:
    # Every 6 hours — refine once ingestion is production-ready
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Placeholder sync job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Phase 1: price-sync workflow scaffolded."
          echo "Phase 3+ will invoke the ingestion CLI with service-role credentials."
          uv run python -c "from src.adapters.mock import MockRetailerAdapter; import asyncio; print(asyncio.run(MockRetailerAdapter().fetch_listings())[0].title)"
